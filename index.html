<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">

<title>Mahebourg Delivery Rider</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#f5f7f7;
  color:#16302d;
}

.app{
  width:100%;
  max-width:560px;
  margin:auto;
  min-height:100vh;
}

.header{
  background:linear-gradient(135deg,#0f766e,#159a8c);
  color:white;
  padding:25px 18px;
  border-radius:0 0 25px 25px;
  box-shadow:0 8px 22px rgba(15,118,110,.18);
}

.brand{
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
  opacity:.9;
}

.title{
  font-size:27px;
  font-weight:850;
  margin-top:7px;
}

.content{
  padding:16px;
}

.card{
  background:white;
  border:1px solid #dce7e5;
  border-radius:18px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 7px 22px rgba(15,118,110,.07);
}

.section-title{
  font-size:18px;
  font-weight:850;
  margin-bottom:14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #dce7e5;
  border-radius:13px;
  font-size:15px;
  margin-bottom:11px;
  outline:none;
}

input:focus{
  border-color:#0f766e;
  box-shadow:0 0 0 3px rgba(15,118,110,.10);
}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.primary{
  background:#0f766e;
  color:white;
}

.secondary{
  background:#e8f5f3;
  color:#0f766e;
}

.logout{
  background:#fee2e2;
  color:#b91c1c;
}

.hidden{
  display:none!important;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:11px;
  font-size:12px;
  line-height:1.55;
  margin-bottom:12px;
  word-break:break-word;
}

.success{
  background:#dff7ef;
  color:#0f766e;
  padding:11px;
  border-radius:11px;
  font-size:12px;
  margin-bottom:12px;
}

.profile{
  background:#f0faf8;
  border:1px solid #cbe6e2;
  border-radius:13px;
  padding:13px;
  font-size:13px;
  line-height:1.8;
  margin-bottom:13px;
  word-break:break-word;
}

.order{
  border:1px solid #dce7e5;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
}

.order-id{
  color:#0f766e;
  font-size:18px;
  font-weight:900;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#fff4d8;
  color:#8a5a00;
  font-size:11px;
  font-weight:800;
  margin-top:5px;
}

.info{
  font-size:13px;
  line-height:1.65;
  margin-top:11px;
}

.actions{
  display:grid;
  gap:8px;
  margin-top:14px;
}

.empty{
  padding:20px;
  text-align:center;
  color:#6b7d7a;
  border:1px dashed #dce7e5;
  border-radius:13px;
}

.loading{
  text-align:center;
  padding:18px;
  color:#6b7d7a;
}

.small{
  font-size:11px;
  color:#6b7d7a;
  margin-top:10px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">
    MAHEBOURG • DELIVERY RIDER
  </div>

  <div class="title">
    Rider Dashboard 🛵
  </div>
</header>


<main class="content">


<!-- ================= LOGIN ================= -->

<section id="loginView">

  <div class="card">

    <div class="section-title">
      Rider Login
    </div>

    <div id="loginError" class="error hidden"></div>

    <input
      id="email"
      type="email"
      placeholder="Rider email"
      autocomplete="email"
      value="offacts39@gmail.com"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="btn primary"
      onclick="loginRider()"
    >
      Login
    </button>

    <div class="small">
      Login using the email and password created in Firebase Authentication.
    </div>

  </div>

</section>



<!-- ================= DASHBOARD ================= -->

<section id="dashboardView" class="hidden">

  <div class="card">

    <div class="section-title">
      Welcome,
      <span id="riderName">Rider</span>
      👋
    </div>

    <div id="profileBox" class="profile">
      Loading rider profile...
    </div>

    <div id="dashboardMessage"></div>

    <button
      class="btn logout"
      onclick="logoutRider()"
    >
      Logout
    </button>

  </div>


  <div class="card">

    <div class="section-title">
      📦 My Orders
    </div>

    <div id="ordersList">
      <div class="loading">
        Loading orders...
      </div>
    </div>

  </div>

</section>


</main>
</div>



<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getDatabase,
  ref,
  get,
  onValue,
  update
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBZzPmYBJNqio_IDrPn6abTVFoci-7GKtI",

  authDomain:
    "delivery-5d936.firebaseapp.com",

  databaseURL:
    "https://delivery-5d936-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "delivery-5d936",

  storageBucket:
    "delivery-5d936.firebasestorage.app",

  messagingSenderId:
    "980186352754",

  appId:
    "1:980186352754:web:02785a4144fd6f174746eb",

  measurementId:
    "G-P9ZS24E9Q8"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const auth =
  getAuth(app);


/* =========================================================
   CURRENT RIDER
========================================================= */

let currentUser = null;
let ordersUnsubscribe = null;


/* =========================================================
   LOGIN
========================================================= */

async function loginRider(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const button =
    document
      .getElementById("loginButton");

  hideLoginError();


  if(!email){

    showLoginError(
      "Please enter the rider email."
    );

    return;
  }


  if(!password){

    showLoginError(
      "Please enter the password."
    );

    return;
  }


  button.disabled = true;
  button.textContent = "Logging in...";


  try{

    /*
      IMPORTANT:
      Firebase Authentication performs the actual login.
    */

    const credential =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      credential.user;


    console.log(
      "Firebase Authentication successful."
    );

    console.log(
      "REAL AUTH UID:",
      user.uid
    );


    /*
      After successful login,
      use the REAL Firebase UID.

      No hard-coded UID is used.
    */

    await loadRiderProfile(
      user
    );

  }

  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    /*
      If anything fails,
      sign the user out so the next
      page load starts clean.
    */

    try{
      await signOut(auth);
    }
    catch(e){
      console.error(e);
    }


    showLogin();

    showLoginError(
      getFirebaseErrorMessage(error)
    );

  }

  finally{

    button.disabled = false;
    button.textContent = "Login";

  }

}


window.loginRider =
  loginRider;


/* =========================================================
   LOAD RIDER PROFILE
========================================================= */

async function loadRiderProfile(user){

  const uid =
    user.uid;


  console.log(
    "Checking rider profile:"
  );

  console.log(
    "users/" + uid
  );


  /*
    EXACT DATABASE PATH:

    users/{Firebase Authentication UID}
  */

  const profileRef =
    ref(
      db,
      "users/" + uid
    );


  const snapshot =
    await get(
      profileRef
    );


  console.log(
    "Profile exists:",
    snapshot.exists()
  );

  console.log(
    "Profile data:",
    snapshot.val()
  );


  if(!snapshot.exists()){

    await safeSignOut();


    showLogin();

    showLoginError(

      "Rider profile not found.\n\n" +

      "Firebase Authentication UID:\n" +

      uid +

      "\n\n" +

      "Required Database path:\n" +

      "users/" + uid +

      "\n\n" +

      "Required fields:\n" +

      "name: Rider 1\n" +

      "phone: 58591926\n" +

      "role: rider"

    );

    return;
  }


  const profile =
    snapshot.val();


  /*
    ROLE CHECK
  */

  const role =
    String(
      profile.role || ""
    )
      .trim()
      .toLowerCase();


  if(role !== "rider"){

    await safeSignOut();

    showLogin();

    showLoginError(

      "This Firebase account does not have rider access.\n\n" +

      "Current role: " +

      (
        profile.role ||
        "not found"
      )

    );

    return;
  }


  /*
    RIDER LOGIN SUCCESS
  */

  currentUser =
    user;


  document
    .getElementById("riderName")
    .textContent =
      profile.name ||
      "Rider";


  document
    .getElementById("profileBox")
    .innerHTML =

    "<b>Name:</b> " +
    escapeHtml(
      profile.name || "Rider"
    ) +

    "<br>" +

    "<b>Phone:</b> " +
    escapeHtml(
      profile.phone || "-"
    ) +

    "<br>" +

    "<b>Role:</b> " +
    escapeHtml(
      profile.role || "-"
    ) +

    "<br>" +

    "<b>UID:</b> " +
    escapeHtml(
      uid
    );


  showDashboard();


  loadOrders(
    uid
  );

}


/* =========================================================
   SHOW LOGIN
========================================================= */

function showLogin(){

  document
    .getElementById("loginView")
    .classList
    .remove("hidden");


  document
    .getElementById("dashboardView")
    .classList
    .add("hidden");

}


/* =========================================================
   SHOW DASHBOARD
========================================================= */

function showDashboard(){

  document
    .getElementById("loginView")
    .classList
    .add("hidden");


  document
    .getElementById("dashboardView")
    .classList
    .remove("hidden");

}


/* =========================================================
   LOGIN ERROR
========================================================= */

function showLoginError(message){

  const box =
    document
      .getElementById("loginError");


  box.innerHTML =
    escapeHtml(
      String(message)
    )
    .replace(
      /\n/g,
      "<br>"
    );


  box.classList.remove(
    "hidden"
  );

}


function hideLoginError(){

  document
    .getElementById("loginError")
    .classList
    .add("hidden");

}


/* =========================================================
   LOAD RIDER ORDERS
========================================================= */

function loadOrders(riderUid){

  /*
    Prevent duplicate listeners.
  */

  if(ordersUnsubscribe){

    ordersUnsubscribe();

    ordersUnsubscribe =
      null;
  }


  const ordersRef =
    ref(
      db,
      "orders"
    );


  ordersUnsubscribe =
    onValue(

      ordersRef,

      snapshot => {

        const data =
          snapshot.val() || {};


        const orders =

          Object
            .entries(data)

            .map(
              ([key, order]) => ({

                key:key,

                ...(order || {})

              })
            )

            .filter(
              order =>
                String(
                  order.riderUid || ""
                ) === String(
                  riderUid
                )
            )

            .sort(
              (a,b) => {

                const dateA =
                  new Date(
                    a.createdAt || 0
                  ).getTime();

                const dateB =
                  new Date(
                    b.createdAt || 0
                  ).getTime();

                return dateB - dateA;

              }
            );


        renderOrders(
          orders
        );

      },

      error => {

        console.error(
          "ORDERS ERROR:",
          error
        );


        document
          .getElementById("ordersList")
          .innerHTML =

          "<div class='error'>" +

          "Could not load orders.<br><br>" +

          escapeHtml(
            error.code ||
            error.message ||
            "Unknown Firebase error"
          ) +

          "</div>";

      }

    );

}


/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders(orders){

  const root =
    document
      .getElementById("ordersList");


  if(!orders.length){

    root.innerHTML =

      "<div class='empty'>" +

      "No orders assigned to you yet." +

      "</div>";

    return;
  }


  root.innerHTML =
    orders
      .map(
        order =>
          createOrderHTML(
            order
          )
      )
      .join("");

}


/* =========================================================
   CREATE ORDER HTML
========================================================= */

function createOrderHTML(order){

  const status =
    String(
      order.status ||
      "New"
    );


  let buttons = "";


  /*
    ACCEPTED → PICKED UP
  */

  if(status === "Accepted"){

    buttons +=

      "<button " +

      "class='btn primary' " +

      "onclick=\"changeStatus('" +

      escapeAttribute(
        order.key
      ) +

      "','Picked Up')\">" +

      "🛒 Mark Picked Up" +

      "</button>";

  }


  /*
    PICKED UP → OUT FOR DELIVERY
  */

  if(status === "Picked Up"){

    buttons +=

      "<button " +

      "class='btn primary' " +

      "onclick=\"changeStatus('" +

      escapeAttribute(
        order.key
      ) +

      "','Out for Delivery')\">" +

      "🚚 Start Delivery" +

      "</button>";

  }


  /*
    OUT FOR DELIVERY → DELIVERED
  */

  if(status === "Out for Delivery"){

    buttons +=

      "<button " +

      "class='btn primary' " +

      "onclick=\"changeStatus('" +

      escapeAttribute(
        order.key
      ) +

      "','Delivered')\">" +

      "✅ Mark Delivered" +

      "</button>";

  }


  /*
    GOOGLE MAP
  */

  if(
    order.deliveryLatitude !== undefined &&
    order.deliveryLongitude !== undefined &&
    order.deliveryLatitude !== null &&
    order.deliveryLongitude !== null
  ){

    const lat =
      Number(
        order.deliveryLatitude
      );

    const lng =
      Number(
        order.deliveryLongitude
      );


    if(
      Number.isFinite(lat) &&
      Number.isFinite(lng)
    ){

      buttons +=

        "<button " +

        "class='btn secondary' " +

        "onclick=\"openMap(" +

        lat +

        "," +

        lng +

        ")\">" +

        "📍 Open Delivery Location" +

        "</button>";

    }

  }


  return `

    <div class="order">

      <div class="order-id">
        ${escapeHtml(
          order.id ||
          order.key ||
          "Order"
        )}
      </div>

      <span class="status">
        ${escapeHtml(status)}
      </span>

      <div class="info">

        👤 <b>Customer:</b>
        ${escapeHtml(
          order.name || "-"
        )}

        <br>

        📞 <b>Phone:</b>
        ${escapeHtml(
          order.phone || "-"
        )}

        <br><br>

        🛒 <b>Items:</b>
        ${escapeHtml(
          order.items || "-"
        )}

        <br><br>

        📍 <b>Pickup:</b>
        ${escapeHtml(
          order.pickup || "-"
        )}

        <br>

        🏠 <b>Delivery:</b>
        ${escapeHtml(
          order.delivery || "-"
        )}

        ${
          order.note
            ? `
              <br>
              📝 <b>Note:</b>
              ${escapeHtml(order.note)}
            `
            : ""
        }

      </div>

      ${
        buttons
          ? `
            <div class="actions">
              ${buttons}
            </div>
          `
          : ""
      }

    </div>

  `;

}


/* =========================================================
   CHANGE ORDER STATUS
========================================================= */

async function changeStatus(
  orderKey,
  newStatus
){

  if(!currentUser){

    alert(
      "Your rider session has expired. Please login again."
    );

    return;
  }


  try{

    const orderRef =
      ref(
        db,
        "orders/" + orderKey
      );


    await update(

      orderRef,

      {

        status:
          newStatus,

        updatedAt:
          new Date()
            .toISOString(),

        riderUid:
          currentUser.uid

      }

    );


    showDashboardMessage(
      "Order updated: " +
      newStatus
    );

  }

  catch(error){

    console.error(
      "STATUS UPDATE ERROR:",
      error
    );


    alert(

      "Could not update order.\n\n" +

      (
        error.code ||
        error.message ||
        "Unknown Firebase error"
      )

    );

  }

}


window.changeStatus =
  changeStatus;


/* =========================================================
   DASHBOARD MESSAGE
========================================================= */

function showDashboardMessage(message){

  const box =
    document
      .getElementById(
        "dashboardMessage"
      );


  box.innerHTML =

    "<div class='success'>" +

    escapeHtml(message) +

    "</div>";


  setTimeout(
    () => {
      box.innerHTML = "";
    },
    3000
  );

}


/* =========================================================
   OPEN GOOGLE MAP
========================================================= */

function openMap(
  latitude,
  longitude
){

  window.open(

    "https://www.google.com/maps?q=" +
    encodeURIComponent(
      latitude + "," + longitude
    ),

    "_blank"

  );

}


window.openMap =
  openMap;


/* =========================================================
   LOGOUT
========================================================= */

async function logoutRider(){

  try{

    if(ordersUnsubscribe){

      ordersUnsubscribe();

      ordersUnsubscribe =
        null;
    }


    await signOut(
      auth
    );


    currentUser =
      null;


    showLogin();

    hideLoginError();


    document
      .getElementById("password")
      .value = "";


    document
      .getElementById("ordersList")
      .innerHTML =

      "<div class='loading'>" +
      "Login to see your orders." +
      "</div>";

  }

  catch(error){

    console.error(
      "LOGOUT ERROR:",
      error
    );

    alert(
      "Logout failed."
    );

  }

}


window.logoutRider =
  logoutRider;


/* =========================================================
   SAFE SIGN OUT
========================================================= */

async function safeSignOut(){

  try{

    if(ordersUnsubscribe){

      ordersUnsubscribe();

      ordersUnsubscribe =
        null;
    }


    await signOut(
      auth
    );

  }

  catch(error){

    console.error(
      "SIGN OUT ERROR:",
      error
    );

  }

}


/* =========================================================
   FIREBASE LOGIN ERROR
========================================================= */

function getFirebaseErrorMessage(error){

  const code =
    error.code || "";


  console.error(
    "Firebase error code:",
    code
  );


  if(
    code.includes(
      "invalid-credential"
    )
  ){

    return (
      "Invalid email or password.\n\n" +
      "Check the email and password in Firebase Authentication."
    );

  }


  if(
    code.includes(
      "invalid-login-credentials"
    )
  ){

    return (
      "Invalid email or password."
    );

  }


  if(
    code.includes(
      "user-not-found"
    )
  ){

    return (
      "No Firebase Authentication account was found for this email."
    );

  }


  if(
    code.includes(
      "wrong-password"
    )
  ){

    return (
      "Incorrect password."
    );

  }


  if(
    code.includes(
      "invalid-email"
    )
  ){

    return (
      "The email address is invalid."
    );

  }


  if(
    code.includes(
      "too-many-requests"
    )
  ){

    return (
      "Too many login attempts. Please wait and try again."
    );

  }


  if(
    code.includes(
      "network-request-failed"
    )
  ){

    return (
      "Network error. Check your internet connection."
    );

  }


  if(
    code.includes(
      "permission-denied"
    )
  ){

    return (
      "Firebase Database permission denied. Check your Realtime Database Rules."
    );

  }


  return (
    error.message ||
    "Login failed. Please try again."
  );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /[&<>'"]/g,

    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"

    }[character])

  );

}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function escapeAttribute(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/* =========================================================
   IMPORTANT:
   THERE IS NO onAuthStateChanged() HERE.

   This means:
   Website opens
       ↓
   Login screen appears
       ↓
   User enters password
       ↓
   Login button
       ↓
   Firebase Authentication
       ↓
   Actual UID
       ↓
   users/{actual UID}
       ↓
   role = rider
       ↓
   Rider Dashboard
========================================================= */

showLogin();

</script>

</body>
