<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahebourg Delivery Rider</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,

.secondary{

.logout{

.hidden{

.status{

}

.status-new{

}

.status-accepted{

  color:#15803d;
}

.status-picked{
  background:#fef3c7;
  color:#92400e;
}

.status-delivery{
  background:#ede9fe;
  color:#6d28d9;
}

.status-delivered{
  background:#dcfce7;
  color:#166534;
}

.status-other{

  color:#8a5a00;
}

.order{
  border:1px solid #dce7e5;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
  background:#fff;
}

.order-id{
  color:#0f766e;
  font-size:18px;
  font-weight:900;
}

.info{
  font-size:13px;
  line-height:1.7;
  margin-top:10px;
}

  display:grid;

  margin-top:14px;

  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:10px;
  line-height:1.55;
  word-break:break-word;
}

.success{
  background:#dff7ef;
  color:#0f766e;
  padding:11px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:10px;
}

.warning{
  background:#fff7ed;
  color:#9a3412;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:10px;
  line-height:1.55;
}

.profile{
  background:#f0faf8;
  border:1px solid #cbe6e2;
  border-radius:13px;
  padding:13px;
  font-size:13px;
  line-height:1.8;
  margin-bottom:12px;
  word-break:break-word;
}

.empty{
  padding:22px 16px;
  text-align:center;
  color:#6b7d7a;
  border:1px dashed #dce7e5;
  border-radius:13px;
  line-height:1.6;
}

.loading{
  text-align:center;
  padding:18px;
  color:#6b7d7a;
}

.small{
  font-size:11px;
  color:#6b7d7a;
  margin-top:8px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">
    MAHEBOURG • DELIVERY RIDER
  </div>

  <div class="title">
    Rider Dashboard 🛵
  </div>

</header>


<main class="content">


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginView">

  <div class="card">

    <div class="section-title">
      Rider Login
    </div>

    <div
      id="loginError"
      class="error hidden">
    </div>

    <input
      id="email"
      type="email"
      placeholder="Rider email"
      autocomplete="email"
      value="offacts39@gmail.com"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="btn primary"
      onclick="loginRider()">

      Login

    </button>

    <div class="small">
      Secure login powered by Firebase Authentication.
    </div>

  </div>

</section>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<section
  id="dashboardView"
  class="hidden">


  <!-- PROFILE -->

  <div class="card">

    <div class="section-title">

      Welcome,
      <span id="riderName">
        Rider

    </div>

      class="profile">

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getDatabase,
  ref,
  get,
  onValue,
  update,
  query,
  orderByChild,
  equalTo
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBZzPmYBJNqio_IDrPn6abTVFoci-7GKtI",

  authDomain:
    "delivery-5d936.firebaseapp.com",

  databaseURL:
    "https://delivery-5d936-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "delivery-5d936",

  storageBucket:
    "delivery-5d936.firebasestorage.app",

  messagingSenderId:
    "980186352754",

  appId:
    "1:980186352754:web:02785a4144fd6f174746eb",

  measurementId:
    "G-P9ZS24E9Q8"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const auth =
  getAuth(app);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let stopOrdersListener = null;


/* =====================================================
   LOGIN
===================================================== */

async function loginRider(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  clearLoginError();


  if(!email){

    showLoginError(
      "Please enter the rider email."
    );

    return;
  }


  if(!password){

    showLoginError(
      "Please enter the password."
    );

    return;
  }


  const button =
    document.getElementById(
      "loginButton"
    );


  button.disabled = true;

  button.textContent =
    "Logging in...";


  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    console.log(
      "Firebase Authentication successful."
    );

    console.log(
      "Firebase UID:",
      result.user.uid
    );

    /*
      DO NOT put the UID here.

      Firebase automatically provides:
      result.user.uid

      onAuthStateChanged() below will
      load users/<that UID>.
    */

  }

  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    showLoginError(
      getFirebaseErrorMessage(
        error
      )
    );

  }

  finally{

    button.disabled = false;

    button.textContent =
      "Login";

  }

}


window.loginRider =
  loginRider;


/* =====================================================
   FIREBASE AUTH STATE
===================================================== */

onAuthStateChanged(

  auth,

  async user => {

    console.log(
      "AUTH STATE:",
      user
        ? user.uid
        : "NO USER"
    );


    if(!user){

      currentUser = null;

      stopOrdersListenerIfNeeded();

      showLogin();

      return;
    }


    currentUser =
      user;


    try{

      await loadRiderProfile(
        user
      );

    }

    catch(error){

      console.error(
        "PROFILE ERROR:",
        error
      );


      stopOrdersListenerIfNeeded();

      showLogin();


      showLoginError(
        formatDatabaseError(
          error,
          user.uid
        )
      );

    }

  }

);


/* =====================================================
   LOAD RIDER PROFILE
===================================================== */

async function loadRiderProfile(user){

  /*
    IMPORTANT:

    We NEVER use a hard-coded UID.

    Firebase Authentication gives us
    the real UID:

      user.uid

    Then we read:

      users/<REAL_FIREBASE_UID>
  */


  const uid =
    user.uid;


  console.log(
    "AUTHENTICATED FIREBASE UID:",
    uid
  );


  const profileRef =
    ref(
      db,
      "users/" + uid
    );


  let snapshot;


  try{

    snapshot =
      await get(
        profileRef
      );

  }

  catch(error){

    console.error(
      "PROFILE READ FAILED:",
      error
    );

    throw error;

  }


  console.log(
    "PROFILE EXISTS:",
    snapshot.exists()
  );


  console.log(
    "PROFILE DATA:",
    snapshot.val()
  );


  /* ===================================================
     PROFILE DOES NOT EXIST
  =================================================== */

  if(!snapshot.exists()){

    throw new Error(
      "PROFILE_NOT_FOUND"
    );

  }


  const profile =
    snapshot.val();


  if(!profile){

    throw new Error(
      "PROFILE_EMPTY"
    );

  }


  /* ===================================================
     CHECK ROLE
  =================================================== */

  const role =
    String(
      profile.role || ""
    )
    .trim()
    .toLowerCase();


  console.log(
    "PROFILE ROLE:",
    role
  );


  if(role !== "rider"){

    await signOut(
      auth
    );


    throw new Error(
      "ROLE_NOT_RIDER:" +
      (
        profile.role ||
        "not set"
      )
    );

  }


  /* ===================================================
     RIDER PROFILE VALID
  =================================================== */

  document
    .getElementById(
      "riderName"
    )
    .textContent =
      profile.name ||
      "Rider";


  document
    .getElementById(
      "profileBox"
    )
    .innerHTML = `

      <b>Rider:</b>
      ${escapeHtml(
        profile.name ||
        "Rider"
      )}

      <br>

      <b>Phone:</b>
      ${escapeHtml(
        profile.phone ||
        "-"
      )}

      <br>

      <b>Role:</b>
      ${escapeHtml(
        profile.role ||
        "-"
      )}

      <br>

      <b>Firebase UID:</b>
      ${escapeHtml(
        uid
      )}

    `;


  showDashboard();


  /*
    Load only orders belonging
    to THIS authenticated UID.
  */

  loadOrders(
    uid
  );

}


/* =====================================================
   LOAD RIDER ORDERS
===================================================== */

function loadOrders(riderUid){

  stopOrdersListenerIfNeeded();


  /*
    Query:

    orders
      where riderUid == Firebase Auth UID
  */

  const ordersQuery =
    query(

      ref(
        db,
        "orders"
      ),

      orderByChild(
        "riderUid"
      ),

      equalTo(
        riderUid
      )

    );


  stopOrdersListener =
    onValue(

      ordersQuery,

      snapshot => {

        console.log(
          "ORDERS DATA:",
          snapshot.val()
        );


        const data =
          snapshot.val() || {};


        const orders =
          Object.entries(
            data
          )
          .map(
            ([key, order]) => ({

              ...order,

              key:key

            })
          );


        orders.sort(
          (a,b) => {

            const dateA =
              new Date(
                a.createdAt || 0
              ).getTime();


            const dateB =
              new Date(
                b.createdAt || 0
              ).getTime();


            return dateB - dateA;

          }
        );


        renderOrders(
          orders
        );

      },


      error => {

        console.error(
          "ORDERS ERROR:",
          error
        );


        document
          .getElementById(
            "ordersList"
          )
          .innerHTML = `

            <div class="error">

              <b>Could not load orders.</b>

              <br><br>

              Error:
              ${escapeHtml(
                error.code ||
                error.message ||
                "Unknown Firebase error"
              )}

              <br><br>

              Check your Firebase
              Realtime Database Rules.

            </div>

          `;

      }

    );

}


/* =====================================================
   STOP ORDER LISTENER
===================================================== */

function stopOrdersListenerIfNeeded(){

  if(
    typeof stopOrdersListener ===
    "function"
  ){

    stopOrdersListener();

    stopOrdersListener =
      null;

  }

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(
  orders
){

  const root =
    document.getElementById(
      "ordersList"
    );


  if(!orders.length){

    root.innerHTML = `

      <div class="empty">

        <div style="font-size:34px;">
          📦
        </div>

        <b>No orders assigned yet.</b>

        <br>

        New orders assigned to you
        will appear here.

      </div>

    `;

    return;

  }


  root.innerHTML =
    orders
      .map(
        order =>
          renderSingleOrder(
            order
          )
      )
      .join("");

}


/* =====================================================
   RENDER SINGLE ORDER
===================================================== */

function renderSingleOrder(
  order
){

  const status =
    String(
      order.status ||
      "New"
    );


  const statusClass =
    getStatusClass(
      status
    );


  const orderId =
    order.id ||
    order.orderId ||
    order.key;


  const customerName =
    order.name ||
    order.customerName ||
    "Customer";


  const phone =
    order.phone ||
    order.customerPhone ||
    "-";


  const items =
    order.items ||
    order.item ||
    "-";


  const pickup =
    order.pickup ||
    order.pickupLocation ||
    "-";


  const delivery =
    order.delivery ||
    order.deliveryLocation ||
    "-";


  const note =
    order.note ||
    "";


  let buttons = "";


  /* ===================================================
     NEW / ASSIGNED
  =================================================== */

  if(
    status === "New" ||
    status === "Assigned"
  ){

    buttons += `

      <button
        class="btn accept"
        onclick="changeStatus(
          '${escapeJs(order.key)}',
          'Accepted'
        )">

        ✅ Accept Order

      </button>

    `;

  }


  /* ===================================================
     ACCEPTED
  =================================================== */

  if(
    status === "Accepted"
  ){

    buttons += `

      <button
        class="btn primary"
        onclick="changeStatus(
          '${escapeJs(order.key)}',
          'Picked Up'
        )">

        🛒 Mark Picked Up

      </button>

    `;

  }


  /* ===================================================
     PICKED UP
  =================================================== */

  if(
    status === "Picked Up"
  ){

    buttons += `

      <button
        class="btn primary"
        onclick="changeStatus(
          '${escapeJs(order.key)}',
          'Out for Delivery'
        )">

        🚚 Start Delivery

      </button>

    `;

  }


  /* ===================================================
     OUT FOR DELIVERY
  =================================================== */

  if(
    status === "Out for Delivery"
  ){

    buttons += `

      <button
        class="btn primary"
        onclick="changeStatus(
          '${escapeJs(order.key)}',
          'Delivered'
        )">

        ✅ Mark Delivered

      </button>

    `;

  }


  /* ===================================================
     GOOGLE MAPS
  =================================================== */

  const latitude =
    Number(
      order.deliveryLatitude
    );


  const longitude =
    Number(
      order.deliveryLongitude
    );


  if(
    Number.isFinite(
      latitude
    ) &&
    Number.isFinite(
      longitude
    )
  ){

    buttons += `

      <button
        class="btn secondary"
        onclick="openMap(
          ${latitude},
          ${longitude}
        )">

        📍 Open Delivery Location

      </button>

    `;

  }


  return `

    <div class="order">


      <div class="order-id">

        ${escapeHtml(
          orderId
        )}

      </div>


      <br>


      <span
        class="status ${statusClass}">

        ${escapeHtml(
          status
        )}

      </span>


      <div class="info">


        👤
        <b>Customer:</b>
        ${escapeHtml(
          customerName
        )}


        <br>


        📞
        <b>Phone:</b>
        ${escapeHtml(
          phone
        )}


        <br><br>


        🛒
        <b>Items:</b>
        ${escapeHtml(
          formatValue(items)
        )}


        <br><br>


        📍
        <b>Pickup:</b>
        ${escapeHtml(
          pickup
        )}


        <br>


        🏠
        <b>Delivery:</b>
        ${escapeHtml(
          delivery
        )}


        ${
          note
          ?

          `

            <br>

            📝
            <b>Note:</b>
            ${escapeHtml(
              note
            )}

          `

          :

          ""

        }


      </div>


      ${
        buttons

        ?

        `

          <div class="actions">

            ${buttons}

          </div>

        `

        :

        ""

      }


    </div>

  `;

}


/* =====================================================
   CHANGE ORDER STATUS
===================================================== */

async function changeStatus(
  orderKey,
  newStatus
){

  if(!currentUser){

    alert(
      "Please login again."
    );

    return;

  }


  if(!orderKey){

    alert(
      "Order ID is missing."
    );

    return;

  }


  const allowedStatuses = [

    "Accepted",

    "Picked Up",

    "Out for Delivery",

    "Delivered"

  ];


  if(
    !allowedStatuses.includes(
      newStatus
    )
  ){

    alert(
      "Invalid order status."
    );

    return;

  }


  try{

    const orderRef =
      ref(
        db,
        "orders/" +
        orderKey
      );


    /*
      Read order first.
    */

    const snapshot =
      await get(
        orderRef
      );


    if(!snapshot.exists()){

      alert(
        "Order no longer exists."
      );

      return;

    }


    const order =
      snapshot.val();


    /*
      SECURITY CHECK:

      Only the rider assigned to
      this order can change it.
    */

    if(
      String(
        order.riderUid ||
        ""
      ) !==
      currentUser.uid
    ){

      alert(
        "This order is not assigned to you."
      );

      return;

    }


    /*
      Update only status/timestamp.
    */

    await update(

      orderRef,

      {

        status:
          newStatus,

        updatedAt:
          new Date()
            .toISOString()

      }

    );


    showMessage(

      "Order updated successfully: " +
      newStatus

    );

  }

  catch(error){

    console.error(
      "STATUS UPDATE ERROR:",
      error
    );


    alert(

      "Could not update order.\n\n" +

      (
        error.code ||
        error.message ||
        "Unknown Firebase error"
      )

    );

  }

}


window.changeStatus =
  changeStatus;


/* =====================================================
   GOOGLE MAPS
===================================================== */

function openMap(
  latitude,
  longitude
){

  if(
    !Number.isFinite(
      latitude
    ) ||
    !Number.isFinite(
      longitude
    )
  ){

    alert(
      "Delivery location is not available."
    );

    return;

  }


  window.open(

    "https://www.google.com/maps?q=" +
    latitude +
    "," +
    longitude,

    "_blank"

  );

}


window.openMap =
  openMap;


/* =====================================================
   LOGOUT
===================================================== */

async function logoutRider(){

  try{

    stopOrdersListenerIfNeeded();


    await signOut(
      auth
    );


    currentUser =
      null;


    showLogin();

  }

  catch(error){

    console.error(
      "LOGOUT ERROR:",
      error
    );

    alert(
      "Logout failed."
    );

  }

}


window.logoutRider =
  logoutRider;


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

  document
    .getElementById(
      "loginView"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "dashboardView"
    )
    .classList
    .add(
      "hidden"
    );

}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(){

  document
    .getElementById(
      "loginView"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "dashboardView"
    )
    .classList
    .remove(
      "hidden"
    );

}


/* =====================================================
   LOGIN ERROR
===================================================== */

function showLoginError(
  message
){

  const box =
    document.getElementById(
      "loginError"
    );


  box.innerHTML =
    escapeHtml(
      String(message)
    )
    .replace(
      /\n/g,
      "<br>"
    );


  box.classList.remove(
    "hidden"
  );

}


function clearLoginError(){

  document
    .getElementById(
      "loginError"
    )
    .classList
    .add(
      "hidden"
    );

}


/* =====================================================
   DASHBOARD MESSAGE
===================================================== */

function showMessage(
  message
){

  const box =
    document.getElementById(
      "dashboardMessage"
    );


  box.innerHTML = `

    <div class="success">

      ${escapeHtml(
        message
      )}

    </div>

  `;


  setTimeout(

    () => {

      box.innerHTML = "";

    },

    3000

  );

}


/* =====================================================
   DATABASE ERROR FORMAT
===================================================== */

function formatDatabaseError(
  error,
  uid
){

  const message =
    String(
      error.message ||
      ""
    );


  if(
    message ===
    "PROFILE_NOT_FOUND"
  ){

    return (

      "Rider profile not found.\n\n" +

      "The app is using the REAL Firebase " +
      "Authentication UID:\n\n" +

      uid +

      "\n\n" +

      "Your Realtime Database must contain:\n\n" +

      "users/" +
      uid +

      "\n\n" +

      "with:\n" +

      "name: Rider 1\n" +

      "phone: 58591926\n" +

      "role: rider"

    );

  }


  if(
    message ===
    "PROFILE_EMPTY"
  ){

    return (

      "The rider profile exists, " +
      "but it is empty.\n\n" +

      "UID:\n" +

      uid

    );

  }


  if(
    message.startsWith(
      "ROLE_NOT_RIDER:"
    )
  ){

    return (

      "This account does not have rider access.\n\n" +

      "Current role: " +

      message.replace(
        "ROLE_NOT_RIDER:",
        ""
      )

    );

  }


  if(
    error.code ===
    "PERMISSION_DENIED"
  ){

    return (

      "Firebase Database permission denied.\n\n" +

      "Check your Realtime Database Rules.\n\n" +

      "Authenticated UID:\n" +

      uid

    );

  }


  return (

    "Could not read rider profile.\n\n" +

    "UID:\n" +

    uid +

    "\n\n" +

    "Error:\n" +

    (
      error.code ||
      error.message ||
      "Unknown Firebase error"
    )

  );

}


/* =====================================================
   FIREBASE AUTH ERROR
===================================================== */

function getFirebaseErrorMessage(
  error
){

  const code =
    error.code || "";


  if(
    code.includes(
      "invalid-credential"
    )
  ){

    return (
      "Invalid email or password."
    );

  }


  if(
    code.includes(
      "invalid-email"
    )
  ){

    return (
      "Invalid email address."
    );

  }


  if(
    code.includes(
      "user-not-found"
    )
  ){

    return (
      "No Firebase account found with this email."
    );

  }


  if(
    code.includes(
      "wrong-password"
    )
  ){

    return (
      "Incorrect password."
    );

  }


  if(
    code.includes(
      "too-many-requests"
    )
  ){

    return (
      "Too many login attempts. Please try again later."
    );

  }


  if(
    code.includes(
      "network-request-failed"
    )
  ){

    return (
      "Network error. Check your internet connection."
    );

  }


  return (
    error.message ||
    "Login failed."
  );

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(
  status
){

  switch(
    String(status)
  ){

    case "New":
      return "status-new";

    case "Assigned":
      return "status-new";

    case "Accepted":
      return "status-accepted";

    case "Picked Up":
      return "status-picked";

    case "Out for Delivery":
      return "status-delivery";

    case "Delivered":
      return "status-delivered";

    default:
      return "status-other";

  }

}


/* =====================================================
   FORMAT VALUE
===================================================== */

function formatValue(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "-";

  }


  if(
    typeof value === "object"
  ){

    try{

      return JSON.stringify(
        value
      );

    }

    catch(error){

      return String(
        value
      );

    }

  }


  return String(
    value
  );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /[&<>'"]/g,

    character => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "'":"&#39;",
      '"':"&quot;"

    }[character])

  );

}


/* =====================================================
   JAVASCRIPT STRING ESCAPE
===================================================== */

function escapeJs(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}
