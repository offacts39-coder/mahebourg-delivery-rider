<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#111827">

<title>Mahebourg Rider</title>

<style>

*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
margin:0;
background:#f4f6f8;
color:#17202a;
}

header{
background:#111827;
color:white;
padding:20px;
}

header h2{
margin:0 0 5px 0;
}

header div{
font-size:14px;
opacity:.8;
}

main{
max-width:600px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:16px;
margin:12px 0;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

input,
select,
button{
width:100%;
padding:13px;
margin:7px 0;
box-sizing:border-box;
border-radius:9px;
border:1px solid #ddd;
font-size:15px;
}

button{
background:#16a34a;
color:white;
border:0;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.blue{
background:#2563eb;
}

.orange{
background:#ea580c;
}

.red{
background:#dc2626;
}

.dark{
background:#111827;
}

.hidden{
display:none;
}

.status{
font-weight:bold;
font-size:16px;
padding:10px;
background:#f3f4f6;
border-radius:9px;
}

.location{
background:#f8fafc;
border:1px solid #e5e7eb;
padding:12px;
border-radius:10px;
margin-top:10px;
line-height:1.5;
}

.gps{
font-size:12px;
color:#64748b;
margin-top:5px;
word-break:break-all;
}

.customer{
line-height:1.6;
}

hr{
border:0;
border-top:1px solid #e5e7eb;
margin:15px 0;
}

.success{
background:#dcfce7;
color:#166534;
padding:12px;
border-radius:10px;
margin-top:10px;
}

</style>

</head>


<body>


<header>

<h2>🛵 Mahebourg Rider</h2>

<div>Delivery Panel</div>

</header>


<main>


<!-- LOGIN -->

<div
id="login"
class="card"
>

<h3>🔐 Rider Login</h3>


<select id="rider">

<option value="">
Select Rider
</option>

<option value="Rider 1">
Rider 1
</option>

<option value="Rider 2">
Rider 2
</option>

<option value="Rider 3">
Rider 3
</option>

</select>


<button
onclick="login()"
>

Login

</button>


<p id="message"></p>

</div>



<!-- RIDER APP -->

<div
id="app"
class="hidden"
>


<div class="card">

<h3 id="riderName">
🛵 Rider
</h3>

<div id="orderCount">
Loading orders...
</div>


<button
class="blue"
onclick="loadOrders()"
>

🔄 Refresh Orders

</button>


<button
class="dark"
onclick="logout()"
>

🚪 Logout

</button>

</div>


<div id="orders"></div>


</div>


</main>



<script type="module">


/* =====================================
   FIREBASE IMPORT
===================================== */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
getDatabase,
ref,
onValue,
update
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";



/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBZzPmYBJNqio_IDrPn6abTVFoci-7GKtI",

authDomain:
"delivery-5d936.firebaseapp.com",

databaseURL:
"https://delivery-5d936-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"delivery-5d936",

storageBucket:
"delivery-5d936.firebasestorage.app",

messagingSenderId:
"980186352754",

appId:
"1:980186352754:web:02785a4144fd6f174746eb"

};



/* =====================================
   INITIALIZE FIREBASE
===================================== */

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);



/* =====================================
   CURRENT RIDER
===================================== */

let currentRider = "";



/* =====================================
   LOGIN
===================================== */

window.login = function(){

const rider =
document.getElementById(
"rider"
).value;


if(!rider){

document.getElementById(
"message"
).textContent =
"❌ Please select a rider.";

return;

}


currentRider =
rider;


sessionStorage.setItem(
"rider",
rider
);


document.getElementById(
"login"
).classList.add(
"hidden"
);


document.getElementById(
"app"
).classList.remove(
"hidden"
);


document.getElementById(
"riderName"
).textContent =
"🛵 " + rider;


loadOrders();

};



/* =====================================
   LOGOUT
===================================== */

window.logout = function(){

sessionStorage.removeItem(
"rider"
);

location.reload();

};



/* =====================================
   LOAD ASSIGNED ORDERS
===================================== */

window.loadOrders = function(){

const ordersRef =
ref(
db,
"orders"
);


onValue(

ordersRef,

(snapshot)=>{


const data =
snapshot.val() || {};


const assigned = [];


Object.keys(data).forEach(
function(id){

const order =
data[id];


if(

order.rider === currentRider

&&

order.status !==
"Delivered"

&&

order.status !==
"Cancelled"

){

assigned.push({

id:id,

data:order

});

}

});


document.getElementById(
"orderCount"
).textContent =

assigned.length +
" assigned order(s)";


renderOrders(
assigned
);

},

(error)=>{

console.error(error);

document.getElementById(
"orders"
).innerHTML = `

<div class="card">

<h3>❌ Could not load orders</h3>

<p>
Please check your internet connection
and Firebase settings.
</p>

</div>

`;

}

);

};



/* =====================================
   DISPLAY ORDERS
===================================== */

function renderOrders(list){

const container =
document.getElementById(
"orders"
);


if(list.length === 0){

container.innerHTML = `

<div class="card">

<h3>🎉 No assigned orders</h3>

<p>
New orders will appear here when
Admin assigns them to you.
</p>

</div>

`;

return;

}



container.innerHTML =

list.map(
function(item){


const id =
item.id;

const order =
item.data;


const status =
order.status ||
"Rider Assigned";



/* GPS DATA */

const pickupLat =
order.pickupLatitude;

const pickupLng =
order.pickupLongitude;

const deliveryLat =
order.deliveryLatitude;

const deliveryLng =
order.deliveryLongitude;



/* DISPLAY */

const pickupText =

order.pickup ||
order.pickupLocation ||
"Not provided";


const deliveryText =

order.delivery ||
order.deliveryLocation ||
"Not provided";


const customerName =

order.name ||
order.customerName ||
"Customer";


const phone =

order.phone ||
"";



return `

<div class="card">


<h3>

📦 Order ${escapeHTML(id)}

</h3>


<div class="status">

Status: ${escapeHTML(status)}

</div>


<hr>


<p>

<b>🛒 Grocery Items</b>

</p>


<div class="location">

${escapeHTML(
order.items ||
"Not provided"
)}

</div>



<!-- PICKUP -->

<div class="location">

<b>📍 Pickup Location</b>

<br><br>

${escapeHTML(
pickupText
)}


${
pickupLat && pickupLng

?

`

<div class="gps">

GPS:
${escapeHTML(
pickupLat
)},
${escapeHTML(
pickupLng
)}

</div>

`

:

`

<div class="gps">

⚠️ GPS coordinates not available

</div>

`

}

</div>



<button

class="blue"

onclick="navigateGPS(
'${safeValue(pickupLat)}',
'${safeValue(pickupLng)}',
'pickup',
'${safeValue(pickupText)}'
)"

>

📍 Navigate to Pickup

</button>



<!-- DELIVERY -->

<div class="location">

<b>🏠 Customer Delivery</b>

<br><br>

${escapeHTML(
deliveryText
)}


${
deliveryLat && deliveryLng

?

`

<div class="gps">

GPS:
${escapeHTML(
deliveryLat
)},
${escapeHTML(
deliveryLng
)}

</div>

`

:

`

<div class="gps">

⚠️ GPS coordinates not available

</div>

`

}

</div>



<button

class="orange"

onclick="navigateGPS(
'${safeValue(deliveryLat)}',
'${safeValue(deliveryLng)}',
'delivery',
'${safeValue(deliveryText)}'
)"

>

🏠 Navigate to Customer

</button>



<hr>


<!-- CUSTOMER -->

<div class="customer">

<b>👤 Customer</b>

<br>

${escapeHTML(
customerName
)}

<br><br>

<b>📞 Phone</b>

<br>

${escapeHTML(
phone ||
"Not provided"
)}

</div>



<button

onclick="callCustomer(
'${safeValue(phone)}'
)"

>

📞 Call Customer

</button>



<hr>


<!-- STATUS -->

<button

onclick="changeStatus(
'${safeValue(id)}',
'Picked Up'
)"

>

🛒 Picked Up

</button>


<button

class="blue"

onclick="changeStatus(
'${safeValue(id)}',
'Out for Delivery'
)"

>

🚚 Out for Delivery

</button>


<button

onclick="changeStatus(
'${safeValue(id)}',
'Delivered'
)"

>

✅ Delivered

</button>



</div>

`;

}

).join("");

}



/* =====================================
   GOOGLE MAPS GPS NAVIGATION
===================================== */

window.navigateGPS = function(
lat,
lng,
type,
address
){


lat =
String(lat || "").trim();

lng =
String(lng || "").trim();

address =
String(address || "").trim();



/* REMOVE GPS PREFIX */

lat =
lat.replace(
"GPS:",
""
).trim();


lng =
lng.replace(
"GPS:",
""
).trim();



/* =====================================
   EXACT GPS AVAILABLE
===================================== */

if(

lat !== "" &&

lng !== ""

){

const destination =
lat + "," + lng;


const mapsURL =

"https://www.google.com/maps/dir/?api=1" +

"&destination=" +

encodeURIComponent(
destination
) +

"&travelmode=driving";


window.open(
mapsURL,
"_blank"
);

return;

}



/* =====================================
   GPS NOT AVAILABLE
===================================== */

if(address !== ""){

const mapsURL =

"https://www.google.com/maps/dir/?api=1" +

"&destination=" +

encodeURIComponent(
address
) +

"&travelmode=driving";


window.open(
mapsURL,
"_blank"
);

return;

}



alert(

"❌ Location is not available for this order."

);

};



/* =====================================
   CALL CUSTOMER
===================================== */

window.callCustomer = function(
phone
){

phone =
String(phone || "").trim();


if(!phone){

alert(
"❌ Customer phone number unavailable."
);

return;

}


window.location.href =
"tel:" + phone;

};



/* =====================================
   CHANGE ORDER STATUS
===================================== */

window.changeStatus = async function(
orderID,
newStatus
){

try{


await update(

ref(
db,
"orders/" +
orderID
),

{

status:
newStatus

}

);


alert(
"✅ Order status updated to: "
+
newStatus
);


loadOrders();


}

catch(error){

console.error(error);

alert(
"❌ Could not update order."
);

}

};



/* =====================================
   HTML SECURITY
===================================== */

function escapeHTML(value){

return String(
value ?? ""
).replace(
/[&<>'"]/g,
function(char){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[char];

}

);

}



/* =====================================
   SAFE BUTTON VALUES
===================================== */

function safeValue(value){

return String(
value ?? ""
)

.replace(
/\\/g,
"\\\\"
)

.replace(
/'/g,
"\\'"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/\n/g,
" "
)

.replace(
/\r/g,
" "
);

}



/* =====================================
   AUTO LOGIN
===================================== */

const savedRider =
sessionStorage.getItem(
"rider"
);


if(savedRider){

currentRider =
savedRider;


document.getElementById(
"login"
).classList.add(
"hidden"
);


document.getElementById(
"app"
).classList.remove(
"hidden"
);


document.getElementById(
"riderName"
).textContent =
"🛵 " +
savedRider;


loadOrders();

}

</script>

</body>

</html>
