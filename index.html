<script type="module">


/* ==================================================

  signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBZzPmYBJNqio_IDrPn6abTVFoci-7GKtI",

  authDomain:
    "delivery-5d936.firebaseapp.com",

  databaseURL:
    "https://delivery-5d936-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "delivery-5d936",

  storageBucket:
    "delivery-5d936.firebasestorage.app",

  messagingSenderId:
    "980186352754",

  appId:
    "1:980186352754:web:02785a4144fd6f174746eb",

  measurementId:
    "G-P9ZS24E9Q8"

};



/* ==================================================
   INITIALIZE FIREBASE
================================================== */

const app =
  initializeApp(
    firebaseConfig
  );


const db =
  getDatabase(
    app
  );


const auth =
  getAuth(
    app

/* ==================================================
   GLOBAL VARIABLES
================================================== */

let currentUser =
  null;

let stopOrdersListener =
  null;



/* ==================================================
   LOGIN
================================================== */

async function loginRider(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  clearLoginError();


  if(!email){

    showLoginError(
      "Please enter the rider email."
    );

    return;

  }


  if(!password){

    showLoginError(
      "Please enter the password."
    );

    return;

  }


  const button =
    document
      .getElementById(
        "loginButton"
      );


  button.disabled =
    true;


  button.textContent =
    "Logging in...";


  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    console.log(
      "LOGIN SUCCESS"
    );


    console.log(
      "AUTH UID:",
      result.user.uid
    );


    /*
      onAuthStateChanged()
      will automatically continue
      with profile loading.
    */

  }


  catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    showLoginError(
      getFirebaseErrorMessage(
        error
      )
    );

  }


  finally{

    button.disabled =
      false;


    button.textContent =
      "Login";

  }

}


window.loginRider =
  loginRider;



/* ==================================================
   AUTH STATE
================================================== */

onAuthStateChanged(

  auth,

  async user => {


    console.log(
      "AUTH STATE:",
      user
        ? user.uid
        : "NO USER"
    );


    if(!user){

      currentUser =
        null;


      stopOrdersListenerIfNeeded();


      showLogin();


      return;

    }


    currentUser =
      user;


    try{

      await loadRiderProfile(
        user
      );

    }


    catch(error){

      console.error(
        "PROFILE ERROR:",
        error
      );


      stopOrdersListenerIfNeeded();


      showLogin();


      showLoginError(
        formatDatabaseError(
          error,
          user.uid
        )
      );

    }

  }

);



/* ==================================================
   LOAD RIDER PROFILE
================================================== */

async function loadRiderProfile(
  user
){

  const uid =
    user.uid;


  console.log(
    "AUTHENTICATED UID:",
    uid
  );


  /*
    IMPORTANT:

    Profile must exist here:

    users/
      AUTH_UID/
        name
        phone
        role

  */


  const profileRef =
    ref(
      db,
      "users/" + uid
    );


  let snapshot;


  try{

    snapshot =
      await get(
        profileRef
      );

  }


  catch(error){

    /*
      This is a REAL database
      permission/network error.
    */

    console.error(
      "PROFILE READ FAILED:",
      error
    );


    throw error;

  }


  console.log(
    "PROFILE EXISTS:",
    snapshot.exists()
  );


  console.log(
    "PROFILE:",
    snapshot.val()
  );


  if(!snapshot.exists()){

    throw new Error(
      "PROFILE_NOT_FOUND"
    );

  }


  const profile =
    snapshot.val();


  if(!profile){

    throw new Error(
      "PROFILE_EMPTY"
    );

  }


  const role =
    String(
      profile.role || ""
    )
    .trim()
    .toLowerCase();


  console.log(
    "PROFILE ROLE:",
    role
  );


  if(role !== "rider"){

    await signOut(
      auth
    );


    throw new Error(
      "ROLE_NOT_RIDER:" +
      (
        profile.role ||
        "not set"
      )
    );

  }


  /*
    PROFILE IS VALID
  */


  document
    .getElementById(
      "riderName"
    )
    .textContent =
      profile.name ||
      "Rider";


  document
    .getElementById(
      "profileBox"
    )
    .innerHTML = `

      <b>Rider:</b>
      ${escapeHtml(
        profile.name ||
        "Rider"
      )}

      <br>

      <b>Phone:</b>
      ${escapeHtml(
        profile.phone ||
        "-"
      )}

      <br>

      <b>Role:</b>
      ${escapeHtml(
        profile.role ||
        "-"
      )}

      <br>

      <b>Firebase UID:</b>
      ${escapeHtml(
        uid
      )}

    `;


  showDashboard();


  loadOrders(
    uid
  );

}



/* ==================================================
   LOAD RIDER ORDERS
================================================== */

function loadOrders(
  riderUid
){

  stopOrdersListenerIfNeeded();


  /*
    IMPORTANT:

    Instead of downloading ALL orders,
    we ask Firebase only for orders
    whose riderUid equals this rider UID.

  */

  const ordersQuery =
    query(

      ref(
        db,
        "orders"
      ),

      orderByChild(
        "riderUid"
      ),

      equalTo(
        riderUid
      )

    );


  stopOrdersListener =

    onValue(

      ordersQuery,

      snapshot => {


        console.log(
          "ORDERS SNAPSHOT:",
          snapshot.val()
        );


        const data =
          snapshot.val() || {};


        const orders = [];


        Object.entries(
          data
        )
        .forEach(
          ([key, order]) => {

            orders.push({

              ...order,

              key:key

            });

          }
        );


        orders.sort(
          (
            a,
            b
          ) => {

            const dateA =
              new Date(
                a.createdAt || 0
              ).getTime();


            const dateB =
              new Date(
                b.createdAt || 0
              ).getTime();


            return dateB - dateA;

          }
        );


        renderOrders(
          orders
        );

      },


      error => {


        console.error(
          "ORDERS READ ERROR:",
          error
        );


        document
          .getElementById(
            "ordersList"
          )
          .innerHTML = `

            <div class="error">

              <b>Could not load orders.</b>

              <br><br>

              Error:

              ${escapeHtml(
                error.code ||
                error.message ||
                "Unknown error"
              )}

              <br><br>

              Make sure your Firebase
              Realtime Database Rules allow
              this rider to query orders.

            </div>

          `;

      }

    );

}



/* ==================================================
   RENDER ORDERS
================================================== */

function renderOrders(
  orders
){

  const root =
    document.getElementById(
      "ordersList"
    );


  if(!orders.length){

    root.innerHTML = `

      <div class="empty">

        <div style="font-size:32px;">
          📦
        </div>

        <b>No orders assigned yet.</b>

        <br>

        <span>
          New orders assigned to you
          will appear here.
        </span>

      </div>

    `;

    return;

  }


  root.innerHTML =

    orders
      .map(
        order =>
          renderSingleOrder(
            order
          )
      )
      .join("");

}



/* ==================================================
   RENDER ONE ORDER
================================================== */

function renderSingleOrder(
  order
){

  const status =
    String(
      order.status ||
      "New"
    );


  const statusClass =
    getStatusClass(
      status
    );


  const orderId =
    order.id ||
    order.orderId ||
    order.key;


  const customerName =
    order.name ||
    order.customerName ||
    "Customer";


  const phone =
    order.phone ||
    order.customerPhone ||
    "-";


  const items =
    order.items ||
    order.item ||
    "-";


  const pickup =
    order.pickup ||
    order.pickupLocation ||
    "-";


  const delivery =
    order.delivery ||
    order.deliveryLocation ||
    "-";


  const note =
    order.note ||
    "";


  let buttons = "";


  /*
    NEW / ASSIGNED
    ----------------
    Rider can accept.
  */

  if(
    status === "New" ||
    status === "Assigned"
  ){

    buttons += `

      <button
        class="btn accept"
        onclick="changeStatus(
          '${escapeJs(order.key)}',
          'Accepted'
        )"
      >

        ✅ Accept Order

      </button>

    `;

  }


  /*
    ACCEPTED
    ----------------
  */

  if(
    status === "Accepted"
  ){

    buttons += `

      <button
        class="btn primary"
        onclick="changeStatus(
          '${escapeJs(order.key)}',
          'Picked Up'
        )"
      >

        🛒 Mark Picked Up

      </button>

    `;

  }


  /*
    PICKED UP
    ----------------
  */

  if(
    status === "Picked Up"
  ){

    buttons += `

      <button
        class="btn primary"
        onclick="changeStatus(
          '${escapeJs(order.key)}',
          'Out for Delivery'
        )"
      >

        🚚 Start Delivery

      </button>

    `;

  }


  /*
    OUT FOR DELIVERY
    ----------------
  */

  if(
    status === "Out for Delivery"
  ){

    buttons += `

      <button
        class="btn primary"
        onclick="changeStatus(
          '${escapeJs(order.key)}',
          'Delivered'
        )"
      >

        ✅ Mark Delivered

      </button>

    `;

  }


  /*
    DELIVERY LOCATION
  */

  const latitude =
    Number(
      order.deliveryLatitude
    );


  const longitude =
    Number(
      order.deliveryLongitude
    );


  if(
    Number.isFinite(
      latitude
    ) &&
    Number.isFinite(
      longitude
    )
  ){

    buttons += `

      <button
        class="btn secondary"
        onclick="openMap(
          ${latitude},
          ${longitude}
        )"
      >

        📍 Open Delivery Location

      </button>

    `;

  }


  return `

    <div class="order">


      <div class="order-id">

        ${escapeHtml(
          orderId
        )}

      </div>


      <br>


      <span
        class="status ${statusClass}"
      >

        ${escapeHtml(
          status
        )}

      </span>


      <div class="info">


        👤
        <b>Customer:</b>

        ${escapeHtml(
          customerName
        )}


        <br>


        📞
        <b>Phone:</b>

        ${escapeHtml(
          phone
        )}


        <br><br>


        🛒
        <b>Items:</b>

        ${escapeHtml(
          typeof items === "object"
            ? JSON.stringify(items)
            : items
        )}


        <br><br>


        📍
        <b>Pickup:</b>

        ${escapeHtml(
          pickup
        )}


        <br>


        🏠
        <b>Delivery:</b>

        ${escapeHtml(
          delivery
        )}


        ${
          note
          ?

          `

          <br>

          📝
          <b>Note:</b>

          ${escapeHtml(
            note
          )}

          `

          :

          ""

        }


      </div>


      ${
        buttons

        ?

        `

        <div class="actions">

          ${buttons}

        </div>

        `

        :

        ""

      }


    </div>

  `;

}



/* ==================================================
   CHANGE ORDER STATUS
================================================== */

async function changeStatus(
  orderKey,
  newStatus
){

  if(!currentUser){

    alert(
      "Please login again."
    );

    return;

  }


  if(!orderKey){

    alert(
      "Order ID is missing."
    );

    return;

  }


  const allowedStatuses = [

    "Accepted",

    "Picked Up",

    "Out for Delivery",

    "Delivered"

  ];


  if(
    !allowedStatuses.includes(
      newStatus
    )
  ){

    alert(
      "Invalid order status."
    );

    return;

  }


  try{


    /*
      First verify that this order
      belongs to the logged-in rider.
    */

    const orderRef =
      ref(
        db,
        "orders/" + orderKey
      );


    const snapshot =
      await get(
        orderRef
      );


    if(!snapshot.exists()){

      alert(
        "Order no longer exists."
      );

      return;

    }


    const order =
      snapshot.val();


    if(
      String(
        order.riderUid || ""
      ) !==
      currentUser.uid
    ){

      alert(
        "This order is not assigned to you."
      );

      return;

    }


    /*
      Update only status and timestamp.
    */

    await update(

      orderRef,

      {

        status:
          newStatus,

        updatedAt:
          new Date()
            .toISOString()

      }

    );


    showMessage(

      "Order updated successfully: " +
      newStatus

    );


  }


  catch(error){

    console.error(
      "STATUS UPDATE ERROR:",
      error
    );


    alert(

      "Could not update order.\n\n" +

      (
        error.code ||
        error.message ||
        "Unknown Firebase error"
      )

    );

  }

}


window.changeStatus =
  changeStatus;



/* ==================================================
   GOOGLE MAPS
================================================== */

function openMap(
  latitude,
  longitude
){

  if(
    !Number.isFinite(
      latitude
    ) ||
    !Number.isFinite(
      longitude
    )
  ){

    alert(
      "Delivery coordinates are not available."
    );

    return;

  }


  const url =
    "https://www.google.com/maps?q=" +
    latitude +
    "," +
    longitude;


  window.open(
    url,
    "_blank"
  );

}


window.openMap =
  openMap;

   SHOW LOGIN
================================================== */

  document
    .getElementById(
      "loginView"
    )
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "dashboardView"
    )
    .classList
    .add(
      "hidden"
    );

}

   SHOW DASHBOARD
================================================== */

function showDashboard(){

  document
    .getElementById(
      "loginView"
    )
    .classList
    .add(
      "hidden"
    );


  document
    .getElementById(
      "dashboardView"
    )
    .classList
    .remove(

    );

}

   LOGOUT
================================================== */

  try{

    stopOrdersListenerIfNeeded();


    await signOut(
      auth

    currentUser =
      null;


    showLogin();


    clearLoginError();

  }


  catch(error){

    console.error(
      "LOGOUT ERROR:",
      error
    );


    alert(
      "Logout failed: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


window.logoutRider =
  logoutRider;



/* ==================================================
   STOP ORDERS LISTENER
================================================== */

function stopOrdersListenerIfNeeded(){

  if(
    typeof stopOrdersListener ===
    "function"
  ){

    stopOrdersListener();

  }


  stopOrdersListener =
    null;

}



/* ==================================================
   DASHBOARD MESSAGE
================================================== */

function showMessage(
  message
){

  const box =
    document.getElementById(
      "dashboardMessage"
    );


  box.innerHTML = `

    <div class="success">

      ${escapeHtml(
        message
      )}

    </div>

  `;


  setTimeout(
    () => {

      box.innerHTML =
        "";

    },
    3000
  );

}



/* ==================================================
   LOGIN ERROR
================================================== */

function showLoginError(
  message
){

  const box =
    document.getElementById(
      "loginError"
    );


  box.innerHTML =

    escapeHtml(
      String(
        message
      )
    )
    .replace(
      /\n/g,
      "<br>"
    );


  box.classList.remove(
    "hidden"
  );

}


function clearLoginError(){

  document
    .getElementById(
      "loginError"
    )
    .classList
    .add(
      "hidden"
    );

}



/* ==================================================
   FIREBASE AUTH ERROR
================================================== */

function getFirebaseErrorMessage(
  error
){

  const code =
    String(
      error.code ||
      ""
    );


  if(
    code.includes(
      "invalid-credential"
    )
  ){

    return (
      "Invalid email or password."
    );

  }


  if(
    code.includes(
      "invalid-login-credentials"
    )
  ){

    return (
      "Invalid email or password."
    );

  }


  if(
    code.includes(
      "invalid-email"
    )
  ){

    return (
      "Invalid email address."
    );

  }


  if(
    code.includes(
      "user-not-found"
    )
  ){

    return (
      "No Firebase Authentication account exists for this email."
    );

  }


  if(
    code.includes(
      "wrong-password"
    )
  ){

    return (
      "Incorrect password."
    );

  }


  if(
    code.includes(
      "too-many-requests"
    )
  ){

    return (
      "Too many login attempts. Please try again later."
    );

  }


  if(
    code.includes(
      "network-request-failed"
    )
  ){

    return (
      "Network error. Check your internet connection."
    );

  }


  return (
    error.message ||
    "Login failed."
  );

}



/* ==================================================
   DATABASE ERROR FORMAT
================================================== */

function formatDatabaseError(
  error,
  uid
){

  const message =
    String(
      error.message ||
      ""
    );


  const code =
    String(
      error.code ||
      ""
    );


  /*
    Permission problem
  */

  if(
    code.includes(
      "permission-denied"
    ) ||
    message.toLowerCase()
      .includes(
        "permission denied"
      )
  ){

    return (

      "Firebase Database permission denied.\n\n" +

      "Logged-in UID:\n" +

      uid +

      "\n\n" +

      "Your Firebase Authentication login is working, " +

      "but Realtime Database Rules are blocking access.\n\n" +

      "Check Realtime Database → Rules."

    );

  }


  /*
    Profile genuinely missing
  */

  if(
    message ===
    "PROFILE_NOT_FOUND"
  ){

    return (

      "Rider profile not found.\n\n" +

      "The logged-in Firebase UID is:\n" +

      uid +

      "\n\n" +

      "Your database must contain:\n\n" +

      "users/" +
      uid +

      "\n\n" +

      "with at least:\n" +

      "name: Rider 1\n" +

      "phone: 58591926\n" +

      "role: rider"

    );

  }


  if(
    message ===
    "PROFILE_EMPTY"
  ){

    return (

      "The rider profile exists, " +

      "but it contains no data."

    );

  }


  if(
    message.startsWith(
      "ROLE_NOT_RIDER:"
    )
  ){

    const role =
      message
        .replace(
          "ROLE_NOT_RIDER:",
          ""
        );


    return (

      "This Firebase account is not a rider.\n\n" +

      "Current role: " +

      role

    );

  }


  return (

    "Firebase profile error.\n\n" +

    "UID:\n" +

    uid +

    "\n\n" +

    "Error:\n" +

    (
      code ||
      message ||
      "Unknown database error"
    )

  );

}



/* ==================================================
   STATUS CSS CLASS
================================================== */

function getStatusClass(
  status
){

  switch(
    status
  ){

    case "New":
    case "Assigned":

      return "status-new";


    case "Accepted":

      return "status-accepted";


    case "Picked Up":

      return "status-picked";


    case "Out for Delivery":

      return "status-delivery";


    case "Delivered":

      return "status-delivered";


    default:

      return "";

  }

}



/* ==================================================
   HTML ESCAPE
================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /[&<>'"]/g,

    character => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      "'":
        "&#39;",

      '"':
        "&quot;"

    }[character])

  );

}



/* ==================================================
   JAVASCRIPT STRING ESCAPE
================================================== */

function escapeJs(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /\\/g,
    "\\\\"
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /\n/g,
    "\\n"
  )

  .replace(
    /\r/g,
    "\\r"
  );

}
