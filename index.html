<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>Rider App</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#f5f7f7;
  color:#16302d;
}

.app{
  max-width:560px;
  margin:auto;
  min-height:100vh;
}

.header{
  background:linear-gradient(135deg,#0f766e,#159a8c);
  color:white;
  padding:24px 18px;
  border-radius:0 0 25px 25px;
}

.brand{
  font-size:13px;
  font-weight:800;
  opacity:.9;
}

.title{
  font-size:27px;
  font-weight:850;
  margin-top:7px;
}

.content{
  padding:16px;
}

.card{
  background:white;
  border:1px solid #dce7e5;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 8px 24px rgba(15,118,110,.08);
}

.section-title{
  font-size:17px;
  font-weight:850;
  margin-bottom:12px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #dce7e5;
  border-radius:13px;
  font-size:15px;
  margin-bottom:10px;
}

.btn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.primary{
  background:#0f766e;
  color:white;
}

.secondary{
  background:#e8f5f3;
  color:#0f766e;
}

.logout{
  background:#fee2e2;
  color:#b91c1c;
}

.hidden{
  display:none!important;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#fff4d8;
  color:#8a5a00;
  font-size:11px;
  font-weight:800;
}

.order{
  border:1px solid #dce7e5;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
}

.order-id{
  color:#0f766e;
  font-size:18px;
  font-weight:900;
}

.info{
  font-size:13px;
  line-height:1.6;
  margin-top:8px;
}

.actions{
  display:grid;
  gap:8px;
  margin-top:12px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:11px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:10px;
}

.success{
  background:#dff7ef;
  color:#0f766e;
  padding:11px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:10px;
}

.empty{
  padding:18px;
  text-align:center;
  color:#6b7d7a;
  border:1px dashed #dce7e5;
  border-radius:13px;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">MAHEBOURG • DELIVERY RIDER</div>
  <div class="title">Rider Dashboard 🛵</div>
</header>

<main class="content">

<!-- LOGIN -->

<section id="loginView">

<div class="card">

<div class="section-title">
Rider Login
</div>

<div id="loginError" class="error hidden"></div>

<input
id="email"
type="email"
placeholder="Rider email"
value="offacts39@gmail.com">

<input
id="password"
type="password"
placeholder="Password">

<button
id="loginButton"
class="btn primary"
onclick="loginRider()">

Login

</button>

</div>

</section>


<!-- DASHBOARD -->

<section id="dashboardView" class="hidden">

<div class="card">

<div class="section-title">
Welcome, <span id="riderName">Rider</span> 👋
</div>

<div id="dashboardMessage"></div>

<button
class="btn logout"
onclick="logoutRider()">

Logout

</button>

</div>


<div class="card">

<div class="section-title">
📦 My Orders
</div>

<div id="ordersList">
Loading orders...
</div>

</div>

</section>

</main>

</div>


<script type="module">

/* =========================================
FIREBASE
========================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getDatabase,
ref,
onValue,
update
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
FIREBASE CONFIG
========================================= */

const firebaseConfig = {

apiKey:
"AIzaSyBZzPmYBJNqio_IDrPn6abTVFoci-7GKtI",

authDomain:
"delivery-5d936.firebaseapp.com",

databaseURL:
"https://delivery-5d936-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"delivery-5d936",

storageBucket:
"delivery-5d936.firebasestorage.app",

messagingSenderId:
"980186352754",

appId:
"1:980186352754:web:02785a4144fd6f174746eb",

measurementId:
"G-P9ZS24E9Q8"

};


const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

const auth =
getAuth(app);


/* =========================================
RIDER UID
========================================= */

const RIDER_UID =
"BDImNMLTSoTcoqJADn0Lo7WLYPx2";


let currentUser = null;


/* =========================================
LOGIN
========================================= */

async function loginRider(){

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;

const errorBox =
document.getElementById("loginError");

errorBox.classList.add("hidden");

if(!email || !password){

errorBox.textContent =
"Please enter email and password.";

errorBox.classList.remove("hidden");

return;

}

const button =
document.getElementById("loginButton");

button.disabled = true;

button.textContent =
"Logging in...";

try{

const result =
await signInWithEmailAndPassword(
auth,
email,
password
);

if(
result.user.uid !== RIDER_UID
){

await signOut(auth);

throw new Error(
"This account is not registered as this rider."
);

}

}catch(error){

console.error(error);

errorBox.textContent =
error.message ||
"Login failed.";

errorBox.classList.remove("hidden");

}

finally{

button.disabled = false;

button.textContent =
"Login";

}

}

window.loginRider =
loginRider;


/* =========================================
AUTH STATE
========================================= */

onAuthStateChanged(
auth,
async user => {

if(!user){

showLogin();

return;

}

try{

const userRef =
ref(
db,
"users/" + user.uid
);

onValue(
userRef,
snapshot => {

const profile =
snapshot.val();

if(
!profile ||
profile.role !== "rider"
){

showLogin();

signOut(auth);

alert(
"This account does not have rider access."
);

return;

}

currentUser =
user;

document.getElementById(
"riderName"
).textContent =
profile.name || "Rider";

showDashboard();

loadOrders();

},
{
onlyOnce:true
}
);

}catch(error){

console.error(error);

}

});


/* =========================================
SHOW LOGIN
========================================= */

function showLogin(){

document.getElementById(
"loginView"
).classList.remove("hidden");

document.getElementById(
"dashboardView"
).classList.add("hidden");

}


/* =========================================
SHOW DASHBOARD
========================================= */

function showDashboard(){

document.getElementById(
"loginView"
).classList.add("hidden");

document.getElementById(
"dashboardView"
).classList.remove("hidden");

}


/* =========================================
LOAD ASSIGNED ORDERS
========================================= */

function loadOrders(){

const ordersRef =
ref(db,"orders");

onValue(
ordersRef,
snapshot => {

const data =
snapshot.val() || {};

const orders =
Object.entries(data)

.map(
([key,order]) => ({
...order,
key:key
})
)

.filter(
order =>
order.riderUid === RIDER_UID
)

.sort(
(a,b) =>
new Date(b.createdAt || 0) -
new Date(a.createdAt || 0)
);

renderOrders(orders);

},
error => {

console.error(error);

document.getElementById(
"ordersList"
).innerHTML =
`
<div class="error">
Could not load orders.
Please check Firebase Database rules.
</div>
`;

});

}


/* =========================================
RENDER ORDERS
========================================= */

function renderOrders(orders){

const root =
document.getElementById(
"ordersList"
);

if(!orders.length){

root.innerHTML =
`
<div class="empty">
No orders assigned to you yet.
</div>
`;

return;

}

root.innerHTML =
orders.map(
order => {

const status =
order.status || "New";

return `

<div class="order">

<div class="order-id">
${escapeHtml(order.id)}
</div>

<br>

<span class="status">
${escapeHtml(status)}
</span>

<div class="info">

👤 <b>Customer:</b>
${escapeHtml(order.name)}

<br>

📞 <b>Phone:</b>
${escapeHtml(order.phone)}

<br><br>

🛒 <b>Items:</b>
${escapeHtml(order.items)}

<br><br>

📍 <b>Pickup:</b>
${escapeHtml(order.pickup)}

<br>

🏠 <b>Delivery:</b>
${escapeHtml(order.delivery)}

${
order.note
?
`
<br>
📝 <b>Note:</b>
${escapeHtml(order.note)}
`
:
""
}

</div>


<div class="actions">

${
status === "Accepted"
?
`
<button
class="btn primary"
onclick="changeStatus(
'${order.key}',
'Picked Up'
)">
🛒 Mark Picked Up
</button>
`
:
""
}


${
status === "Picked Up"
?
`
<button
class="btn primary"
onclick="changeStatus(
'${order.key}',
'Out for Delivery'
)">
🚚 Start Delivery
</button>
`
:
""
}


${
status === "Out for Delivery"
?
`
<button
class="btn primary"
onclick="changeStatus(
'${order.key}',
'Delivered'
)">
✅ Mark Delivered
</button>
`
:
""
}

${
order.deliveryLatitude &&
order.deliveryLongitude
?
`
<button
class="btn secondary"
onclick="openMap(
${order.deliveryLatitude},
${order.deliveryLongitude}
)">
📍 Open Delivery Location
</button>
`
:
""
}

</div>

</div>

`;

}
).join("");

}


/* =========================================
CHANGE STATUS
========================================= */

async function changeStatus(
key,
status
){

try{

await update(

ref(
db,
"orders/" + key
),

{
status:status
}

);

showMessage(
"Order updated: " + status
);

}catch(error){

console.error(error);

alert(
"Could not update order.\n" +
error.code
);

}

}


/* =========================================
MESSAGE
========================================= */

function showMessage(message){

const box =
document.getElementById(
"dashboardMessage"
);

box.innerHTML =
`
<div class="success">
${escapeHtml(message)}
</div>
`;

setTimeout(
() => {
box.innerHTML = "";
},
3000
);

}


/* =========================================
OPEN MAP
========================================= */

function openMap(
latitude,
longitude
){

window.open(
`https://www.google.com/maps?q=${latitude},${longitude}`,
"_blank"
);

}

window.openMap =
openMap;


/* =========================================
LOGOUT
========================================= */

async function logoutRider(){

try{

await signOut(auth);

showLogin();

}catch(error){

console.error(error);

}

}

window.logoutRider =
logoutRider;


/* =========================================
HTML ESCAPE
========================================= */

function escapeHtml(value){

return String(
value ?? ""
)

.replace(
/[&<>'"]/g,

character => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[character])

);

}

</script>

</body>
</html>
